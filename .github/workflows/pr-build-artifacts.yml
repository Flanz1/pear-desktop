name: Build PR Artifacts

# Opt-in: the three-platform installer build runs only for pull requests that
# carry the `build-artifacts` label (adding the label starts it, later pushes
# to a labelled PR rebuild). PR Checks already builds and typechecks the app on
# Linux and Windows for every PR; add the label when you need installers or a
# macOS build.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions: {}

env:
  NODE_VERSION: "24.x"

jobs:
  check-permissions:
    permissions:
      contents: read
    # `labeled` events for any other label are ignored.
    if: >-
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'build-artifacts') &&
      (github.event.action != 'labeled' || github.event.label.name == 'build-artifacts')
    name: Check if user has write access
    runs-on: ubuntu-latest
    outputs:
      has-write-access: ${{ steps.check.outputs.require-result }}
    steps:
      - name: Check user permission
        id: check
        uses: actions-cool/check-user-permission@7b90a27f92f3961b368376107661682c441f6103
        with:
          require: write
          username: ${{ github.event.pull_request.user.login }}

  build:
    name: Build ${{ matrix.os }}
    needs: check-permissions
    if: needs.check-permissions.outputs.has-write-access == 'true'
    runs-on: ${{ matrix.os }}
    # One run per PR and OS: a new push cancels the superseded build instead of
    # letting its jobs queue (macOS runners are scarce and queued jobs get
    # cancelled after 15m). Job-level so runs skipped by the `if` above (an
    # unrelated label, an unlabelled PR) never cancel a build in progress.
    concurrency:
      group: pr-build-artifacts-${{ github.event.pull_request.number }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 12
          run_install: false

      - name: Setup NodeJS
        if: startsWith(matrix.os, 'macOS') != true
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup NodeJS for macOS
        if: startsWith(matrix.os, 'macOS')
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build on macOS
        if: startsWith(matrix.os, 'macOS')
        run: |
          pnpm dist:mac
          pnpm dist:mac:arm64

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo snap install snapcraft --classic
          sudo apt update
          sudo apt install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform/x86_64/24.08
          sudo flatpak install -y flathub org.freedesktop.Sdk/x86_64/24.08
          sudo flatpak install -y flathub org.electronjs.Electron2.BaseApp/x86_64/24.08

      - name: Build on Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          pnpm dist:linux
          pnpm dist:linux:deb-arm64
          pnpm dist:linux:rpm-arm64

      # PR builds are a side-by-side test variant ("Pear Desktop Dev", see
      # electron-builder.dev.yml) so installing or running one cannot replace
      # or share settings with a stable install. Releases are unaffected.
      - name: Build on Windows
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          # Explicit targets: nsis-web (the stable config's default) needs a publish URL.
          pnpm clean
          pnpm build
          pnpm electron-builder --win nsis portable --x64 --arm64 -p never --config electron-builder.dev.yml

      - name: Verify the Windows build is isolated from the stable app
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          for dir in pack/win-unpacked pack/win-arm64-unpacked; do
            [ -d "$dir" ] || continue
            echo "== $dir"
            if [ -e "$dir/resources/app-update.yml" ]; then
              echo "::error::$dir has app-update.yml; the updater must be inactive in the dev variant"
              exit 1
            fi
            asar="$PWD/$dir/resources/app.asar"
            tmp="$(mktemp -d)"
            (cd "$tmp" && npx --yes @electron/asar extract-file "$asar" package.json)
            cat "$tmp/package.json"
            if command -v cygpath > /dev/null; then tmp="$(cygpath -m "$tmp")"; fi
            node -e "const p=require(process.argv[1]); if (p.name!=='pear-desktop-dev' || p.productName!=='Pear Desktop Dev') { console.error('wrong app identity:', p.name, p.productName); process.exit(1); }" "$tmp/package.json"
          done
          ls pack/*.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: build-artifacts-${{ matrix.os }}
          path: pack/
          retention-days: 7
          if-no-files-found: error

  comment:
    name: Comment on PR
    needs: [check-permissions, build]
    if: always() && needs.check-permissions.outputs.has-write-access == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const runId = context.runId;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const buildResult = '${{ needs.build.result }}';

            let comment;
            if (buildResult === 'success') {
              comment = `## 🚀 Build Artifacts Ready!

            The builds have completed successfully. You can download the artifacts from the workflow run:

            **[📦 Download Artifacts](${runUrl})**

            ### Available builds:
            - **Windows**: \`build-artifacts-windows-latest\`
            - **macOS**: \`build-artifacts-macos-latest\`
            - **Linux**: \`build-artifacts-ubuntu-latest\`

            *Note: Artifacts are available for 7 days.*`;
            } else if (buildResult === 'failure') {
              comment = `## ❌ Build Failed

            Unfortunately, one or more builds failed. Please check the workflow run for details:

            **[View Workflow Run](${runUrl})**`;
            } else {
              comment = `## ⚠️ Build Status: ${buildResult}

            The build process completed with status: **${buildResult}**

            **[View Workflow Run](${runUrl})**`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
