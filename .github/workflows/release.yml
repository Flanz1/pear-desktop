name: Release

# Pushing a tag like v3.12.1-remote.1 builds the Windows and Linux desktop app
#  and the signed Android phone remote APK, then creates a
# DRAFT GitHub release. Nothing is public until the draft is published by hand.

on:
  push:
    tags:
      - 'v*-remote.*'

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.x"

jobs:
  verify:
    name: Verify tag and run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag must match package.json and be on master
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$TAG is not on master. Release only from master."
            exit 1
          fi
          if [ ! -f "release-notes/$TAG.md" ]; then
            echo "::error::release-notes/$TAG.md is missing"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 12
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Protocol contract tests
        run: |
          pnpm exec tsc -p protocol/tsconfig.json
          node --test 'protocol/tests/*.test.ts'

      - name: Phone-remote plugin tests
        run: node --test 'src/plugins/phone-remote/tests/*.test.ts'

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: desktop-windows
            targets: --win nsis portable --x64
          - name: Linux
            os: ubuntu-latest
            artifact: desktop-linux
            targets: --linux AppImage rpm deb --x64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 12
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        run: |
          pnpm clean
          pnpm build
          # -p never: publishing is done by the draft-release job, not by electron-builder.
          pnpm electron-builder ${{ matrix.targets }} -p never --config electron-builder.release.yml

      - name: Verify the app updates from this fork
        shell: bash
        run: |
          set -euo pipefail
          dir=""
          for d in pack/win-unpacked pack/linux-unpacked; do
            if [ -d "$d" ]; then dir="$d"; break; fi
          done
          [ -n "$dir" ] || { echo "::error::no unpacked app directory in pack/"; exit 1; }
          echo "== $dir"
          cat "$dir/resources/app-update.yml"
          grep -q 'owner: Flanz1' "$dir/resources/app-update.yml"
          grep -q 'repo: pear-desktop' "$dir/resources/app-update.yml"

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ${{ matrix.artifact }}
          path: |
            pack/*.exe
            pack/*.AppImage
            pack/*.rpm
            pack/*.deb
            pack/*.blockmap
            pack/latest*.yml
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android release APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set; refusing to ship an unsigned or debug-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pear-remote.jks"

      - name: Core tests, lint and release build
        working-directory: mobile
        env:
          PEAR_REMOTE_KEYSTORE_FILE: ${{ runner.temp }}/pear-remote.jks
          PEAR_REMOTE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PEAR_REMOTE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PEAR_REMOTE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:lintRelease :app:assembleRelease --stacktrace

      - name: Verify the APK is signed and name it
        run: |
          set -euo pipefail
          apk="$(ls mobile/app/build/outputs/apk/release/*.apk)"
          echo "$apk"
          case "$apk" in *unsigned*) echo "::error::APK is unsigned"; exit 1;; esac
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk" | head -n 5
          mkdir -p out
          cp "$apk" "out/Pear-Remote-${GITHUB_REF_NAME#v}.apk"
          (cd out && sha256sum *.apk > SHA256SUMS-android.txt)

      - name: Upload APK
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: android-apk
          path: out/
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist-artifacts
          ls -la
          sha256sum *.exe *.AppImage *.rpm *.deb *.apk > SHA256SUMS.txt
          rm -f SHA256SUMS-android.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Desktop versions carry a -remote.N suffix, which the updater treats as a prerelease.
          gh release create "$TAG" dist-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$TAG" \
            --notes-file "release-notes/$TAG.md"
