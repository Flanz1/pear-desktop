# Release variant of the app, built only by .github/workflows/release.yml.
#
# It ships as its own app ("Pear Desktop Remote") so it installs next to the
# upstream Pear Desktop instead of replacing it:
#   - own appId/productName: separate install folder, registry key and shortcuts;
#   - own package name inside the app: separate Electron userData folder
#     (settings, caches, phone-remote state) and single-instance lock;
#   - publish points at this fork's GitHub releases, so app-update.yml makes
#     the built-in updater look there and never at upstream's releases.
extends: ./electron-builder.yml
appId: com.github.flanz1.pear-desktop-remote
productName: Pear Desktop Remote
extraMetadata:
  name: pear-desktop-remote
  productName: Pear Desktop Remote
  desktopName: com.github.flanz1.pear-desktop-remote
publish:
  provider: github
  owner: Flanz1
  repo: pear-desktop
  releaseType: release
win:
  icon: assets/generated/icons/win/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  compression: maximum
nsis:
  artifactName: Pear-Desktop-Remote-Setup-${version}-${arch}.${ext}
portable:
  artifactName: Pear-Desktop-Remote-Portable-${version}-${arch}.${ext}
linux:
  artifactName: Pear-Desktop-Remote-${version}-${arch}.${ext}
  icon: assets/generated/icons/png
  category: AudioVideo
  syncDesktopName: true
  desktop:
    entry:
      StartupWMClass: com.github.flanz1.pear-desktop-remote
  target:
    - target: AppImage
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: deb
      arch:
        - x64
